<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=8">
    <style>
        html, body { background: #f4efe6; }
        .preview { max-width: 1180px; margin: 80px auto; padding: 0 24px; }
    </style>
</head>
<body>
    <div class="preview">
        <div class="waist-features">
            <div class="waist-feat">
                <img src="assets/feat-led.png" alt="120 high-quality LED beads">
                <div class="waist-feat-txt">
                    <h3>120 HIGH-QUALITY<br>LED BEADS</h3>
                    <p>Powerful &amp; even light coverage.</p>
                </div>
            </div>
            <div class="waist-feat">
                <img src="assets/feat-remote.png" alt="Intuitive controller">
                <div class="waist-feat-txt">
                    <h3>INTUITIVE<br>CONTROLLER</h3>
                    <p>Easy-to-use controls for convenient adjustment.</p>
                </div>
            </div>
            <div class="waist-feat">
                <img src="assets/feat-fabric.png" alt="Soft and flexible wrap material">
                <div class="waist-feat-txt">
                    <h3>SOFT &amp; FLEXIBLE<br>MATERIAL</h3>
                    <p>Soft neoprene for flexible comfort.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
